<ng-container *ngVar="(communitiesRD$ | async) as communitiesRD">
  <div *ngIf="communitiesRD?.hasSucceeded ">
    <h2>{{'home.top-level-communities.head' | translate}}</h2>
    <p class="lead">{{'home.top-level-communities.help' | translate}}</p>
    <div class="row" *ngIf="communitiesFetched?.length > 0">
      <div class="col-md-4 my-2" *ngFor="let community of communitiesFetched">
        <div class="card">
          <a routerLink="/communities/{{ community.uuid }}">
            <img class="card-img-top" src="/assets/otcloud/images/{{ community.logo }}.webp" alt="">
          </a>
          <div class="card-body">
            <a routerLink="/communities/{{ community.uuid }}">
              <h5 class="card-title">{{ community.name }}</h5>
            </a>
            <a routerLink="/communities/{{ community.uuid }}" class="btn bg-abud-light-blue d-block text-white justify-content-around">
              View <span class="badge badge-light text-dark"> {{ community.itemsCount }} items </span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <ds-error *ngIf="communitiesRD?.hasFailed " message="{{'error.top-level-communites' | translate}}"></ds-error>
  <ds-themed-loading *ngIf="communitiesRD?.isLoading " message="{{'loading.top-level-communities' | translate}}"></ds-themed-loading>
</ng-container>
