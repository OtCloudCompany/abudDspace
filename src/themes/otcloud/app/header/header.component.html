<header>
    <div class="container">
        <div class="d-flex flex-column align-items-center">
            <a class="navbar-brand my-2" routerLink="/home">
                <img src="assets/otcloud/images/Logo-ABUD.png" [attr.alt]="'menu.header.image.logo' | translate" />
            </a>
            <h1 class="header-title">{{ "repository.header.name" | translate | uppercase }}</h1>
        </div>
        <div class="d-flex flex-row justify-content-between bg-abud-light-blue">
            <div class="d-flex flex-row text-white">
                <ds-themed-navbar></ds-themed-navbar>
            </div>

            <nav role="navigation" [attr.aria-label]="'nav.user.description' | translate"
                class="navbar navbar-light navbar-expand-md flex-shrink-0">
                <ds-themed-search-navbar></ds-themed-search-navbar>
                <ds-themed-lang-switch></ds-themed-lang-switch>
                <ds-context-help-toggle></ds-context-help-toggle>
                <ds-themed-auth-nav-menu></ds-themed-auth-nav-menu>
                <ds-impersonate-navbar></ds-impersonate-navbar>
                <div *ngIf="isMobile$ | async" class="pl-2">
                    <button class="navbar-toggler px-0" type="button" (click)="toggleNavbar()"
                        aria-controls="collapsingNav" aria-expanded="false"
                        [attr.aria-label]="'nav.toggle' | translate">
                        <span class="fas fa-bars fa-fw toggler-icon" aria-hidden="true"></span>
                    </button>
                </div>
            </nav>
        </div>
    </div>
</header>
